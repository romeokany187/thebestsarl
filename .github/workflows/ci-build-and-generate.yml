name: CI Build and (optional) Generate PDFs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      generate_pdfs:
        description: 'If true, start the app and generate example PDFs then commit them.'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  generate-pdfs:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.generate_pdfs == 'true' || env.GENERATE_PDFS == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Start app
        run: |
          npm run start &
          # give server time to boot
          sleep 8
      - name: Generate sample PDFs and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports
          DATE=$(date -u +%Y-%m-%d)
          BASE_URL="http://127.0.0.1:3000"
          curl -s -o reports/paid-${DATE}.pdf "${BASE_URL}/api/payments/report?mode=month&month=$(date -u +%Y-%m)&desk=THE_BEST&ticketStatus=PAID&download=1"
          curl -s -o reports/unpaid-${DATE}.pdf "${BASE_URL}/api/payments/report?mode=month&month=$(date -u +%Y-%m)&desk=THE_BEST&ticketStatus=UNPAID&download=1"
          curl -s -o reports/partial-${DATE}.pdf "${BASE_URL}/api/payments/report?mode=month&month=$(date -u +%Y-%m)&desk=THE_BEST&ticketStatus=PARTIAL&download=1"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports || true
          git commit -m "chore(ci): add generated payment reports for ${DATE}" || echo "no changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
